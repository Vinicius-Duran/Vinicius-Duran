<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340"
     role="img" aria-label="Vinicius Duran, desenvolvedor full-stack em Florianopolis. React, C#, .NET e Node.">
  <title>Vinicius Duran — Desenvolvedor Full-Stack</title>

  <!--
    Mesmo sistema do portfolio (carvao quente, um acento ambar, grotesk
    tecnica), composicao propria: aqui o assunto e a pessoa, nao o projeto.
    Animacao em CSS dentro do SVG, que e o que roda quando o GitHub serve o
    arquivo por <img>. Ciclo de 12s.
  -->

  <defs>
    <style><![CDATA[
      .display { font-family: 'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif; font-weight: 800; }
      .body    { font-family: 'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif; font-weight: 500; }
      .mono    { font-family: 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace; font-weight: 500; }
      .anim { transform-box: fill-box; }

      .guide { stroke-dasharray: 1120; stroke-dashoffset: 1120; animation: draw 12s cubic-bezier(0.23,1,0.32,1) infinite; }
      @keyframes draw {
        0%   { stroke-dashoffset: 1120; opacity: .9; }
        8%   { stroke-dashoffset: 0;    opacity: .9; }
        14%  { opacity: .9; }
        20%  { opacity: .5; }
        95%  { opacity: .5; }
        100% { opacity: 0; }
      }

      .tag { opacity: 0; animation: tag 12s cubic-bezier(0.23,1,0.32,1) infinite; }
      @keyframes tag {
        0%,4% { opacity: 0; transform: translateY(6px); }
        10%   { opacity: 1; transform: translateY(0); }
        95%   { opacity: 1; transform: translateY(0); }
        100%  { opacity: 0; }
      }

      /* O nome e escrito da esquerda para a direita, com o cursor na borda. */
      .wipe { transform-origin: left center; animation: wipe 12s cubic-bezier(0.77,0,0.175,1) infinite; }
      @keyframes wipe {
        0%,7% { transform: scaleX(0); }
        20%   { transform: scaleX(1); }
        100%  { transform: scaleX(1); }
      }
      .caret { transform-origin: left center; animation: caret 12s cubic-bezier(0.77,0,0.175,1) infinite; }
      @keyframes caret {
        0%,7% { transform: translateX(0); opacity: 1; }
        20%   { transform: translateX(600px); opacity: 1; }
        23%   { transform: translateX(600px); opacity: 0; }
        100%  { transform: translateX(600px); opacity: 0; }
      }

      .rule { transform-origin: left center; animation: rule 12s cubic-bezier(0.23,1,0.32,1) infinite; }
      @keyframes rule {
        0%,18% { transform: scaleX(0); }
        27%    { transform: scaleX(1); opacity: 1; }
        95%    { transform: scaleX(1); opacity: 1; }
        100%   { transform: scaleX(1); opacity: 0; }
      }

      /* A frase do site, dita em tres tempos no mesmo lugar. */
      .rot { opacity: 0; animation: rot 12s cubic-bezier(0.23,1,0.32,1) infinite; }
      @keyframes rot {
        0%   { opacity: 0; transform: translateY(10px); }
        3%   { opacity: 1; transform: translateY(0); }
        22%  { opacity: 1; transform: translateY(0); }
        26%  { opacity: 0; transform: translateY(-10px); }
        100% { opacity: 0; transform: translateY(-10px); }
      }
      .rot-1 { animation-delay: 2.4s; }
      .rot-2 { animation-delay: 5.4s; }
      .rot-3 { animation-delay: 8.4s; }

      .chip { opacity: 0; animation: chip 12s cubic-bezier(0.23,1,0.32,1) infinite; }
      @keyframes chip {
        0%,18% { opacity: 0; transform: translateY(10px); }
        26%    { opacity: 1; transform: translateY(0); }
        95%    { opacity: 1; transform: translateY(0); }
        100%   { opacity: 0; }
      }
      .chip-2 { animation-delay: .18s; }
      .chip-3 { animation-delay: .36s; }
      .chip-4 { animation-delay: .54s; }

      @media (prefers-reduced-motion: reduce) {
        .guide, .tag, .wipe, .caret, .rule, .rot, .chip {
          animation: none; opacity: 1; transform: none; stroke-dashoffset: 0;
        }
        .rot-2, .rot-3 { opacity: 0; }
      }
    ]]></style>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <clipPath id="nameClip">
      <rect class="anim wipe" x="64" y="112" width="604" height="82"/>
    </clipPath>
  </defs>

  <rect width="1200" height="340" fill="#14100c"/>
  <rect width="1200" height="340" fill="#221c18" opacity=".55"/>
  <rect width="1200" height="340" filter="url(#grain)" opacity=".055"/>

  <text class="mono tag anim" x="64" y="76" font-size="13" fill="#d9743f" letter-spacing="1.6">whoami</text>

  <g clip-path="url(#nameClip)">
    <text class="display" x="64" y="176" font-size="68" letter-spacing="-2.2" fill="#efe8dc">VINICIUS DURAN</text>
  </g>
  <rect class="anim caret" x="64" y="118" width="9" height="68" fill="#d9743f"/>

  <rect class="anim rule" x="64" y="204" width="360" height="3" fill="#d9743f"/>

  <text class="body tag anim" x="64" y="244" font-size="19" fill="#efe8dc" fill-opacity=".7">Desenvolvedor Full-Stack · Florianópolis, SC</text>

  <!-- A mesma frase do site, dita em tres tempos no mesmo lugar. -->
  <g>
    <text class="mono anim rot rot-1" x="64" y="288" font-size="17" fill="#d9743f">o front que as pessoas usam</text>
    <text class="mono anim rot rot-2" x="64" y="288" font-size="17" fill="#d9743f">o back que sustenta o front</text>
    <text class="mono anim rot rot-3" x="64" y="288" font-size="17" fill="#d9743f">o banco que sustenta os dois</text>
  </g>

  <!-- Guia de montagem e a stack, do lado direito. -->
  <rect class="guide" x="792" y="72" width="344" height="196" rx="14"
        fill="none" stroke="#d9743f" stroke-opacity=".8" stroke-width="1"/>
  <g>
    <g class="chip anim">
      <rect x="820" y="100" width="132" height="42" rx="10" fill="#efe8dc" fill-opacity=".07" stroke="#efe8dc" stroke-opacity=".18"/>
      <text class="mono" x="886" y="127" font-size="15" fill="#efe8dc" fill-opacity=".82" text-anchor="middle">React</text>
    </g>
    <g class="chip chip-2 anim">
      <rect x="976" y="100" width="132" height="42" rx="10" fill="#d9743f" fill-opacity=".16" stroke="#d9743f" stroke-opacity=".5"/>
      <text class="mono" x="1042" y="127" font-size="15" fill="#efe8dc" fill-opacity=".92" text-anchor="middle">C#</text>
    </g>
    <g class="chip chip-3 anim">
      <rect x="820" y="158" width="132" height="42" rx="10" fill="#d9743f" fill-opacity=".16" stroke="#d9743f" stroke-opacity=".5"/>
      <text class="mono" x="886" y="185" font-size="15" fill="#efe8dc" fill-opacity=".92" text-anchor="middle">.NET</text>
    </g>
    <g class="chip chip-4 anim">
      <rect x="976" y="158" width="132" height="42" rx="10" fill="#efe8dc" fill-opacity=".07" stroke="#efe8dc" stroke-opacity=".18"/>
      <text class="mono" x="1042" y="185" font-size="15" fill="#efe8dc" fill-opacity=".82" text-anchor="middle">Node</text>
    </g>
    <text class="mono tag anim" x="820" y="240" font-size="13" fill="#efe8dc" fill-opacity=".42">front · back · banco</text>
  </g>
</svg>
