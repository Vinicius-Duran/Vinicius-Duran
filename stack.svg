<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 806 256" width="806" height="256"
     role="img" aria-label="Stack: front — React, React Native, TypeScript, Vite, CSS/SCSS, Tailwind, GSAP, anime.js; back — C#, .NET, ASP.NET Core, Node.js, Express, Python, APIs REST; dados — SQL Server, MySQL, PostgreSQL; plataforma — Docker, Git, GitHub Actions, Azure, Vercel, Vitest, ESLint.">
  <title>Stack</title>

  <!-- Gerado por scripts/cards.mjs. Não editar à mão. -->

  <defs>
    <style><![CDATA[
      .display { font-family: 'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif; font-weight: 800; }
      .body    { font-family: 'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif; font-weight: 500; }
      .mono    { font-family: 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace; font-weight: 500; }
      .anim { transform-box: fill-box; }

      .chip  { animation: sobe .55s cubic-bezier(0.23,1,0.32,1) both; }
      .linha { animation: sobe .55s cubic-bezier(0.23,1,0.32,1) both; }
      @keyframes sobe {
        from { opacity: 0; transform: translateY(9px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .tag { animation: sobe .55s cubic-bezier(0.23,1,0.32,1) both; }

      @media (prefers-reduced-motion: reduce) {
        .chip, .linha, .tag { animation: none; opacity: 1; transform: none; }
      }
    ]]></style>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

